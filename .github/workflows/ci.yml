name: CI

on:
  push:
    branches: [main, dev, "claude/**"]
    # Skip CI on corpus-only / STATUS-only churn — these don't change any
    # runtime code, so the matrix is wasted effort. PRs and meaningful
    # commits (touching anything else) still trigger the full pipeline.
    paths-ignore:
      - "tests/parity/_corpus.py"
      - "docs/STATUS.md"
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-type:
    name: Lint & type-check (${{ matrix.os }}, Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright strict type check
        run: uv run pyright

      - name: Pytest
        run: uv run pytest -v

      - name: Smoke test - synthesize a sine WAV
        run: uv run python -m dectalk --write-test /tmp/dectalk-smoke.wav
        if: runner.os != 'Windows'

      - name: Smoke test - synthesize a sine WAV (Windows)
        run: uv run python -m dectalk --write-test "$env:TEMP\dectalk-smoke.wav"
        if: runner.os == 'Windows'

      - name: Audio diagnostic harness (intrinsic checks)
        # No DECtalk binary on the runner; harness runs Python only and
        # writes the per-prompt WAVs + Markdown report into artifacts/.
        run: uv run python scripts/diagnose_audio.py --out-dir artifacts/audio
        shell: bash

      - name: Upload audio diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-${{ matrix.os }}-py${{ matrix.python-version }}
          path: artifacts/audio/
          if-no-files-found: warn
          retention-days: 14

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck on scripts/
        run: |
          if [ -d scripts ] && ls scripts/*.sh >/dev/null 2>&1; then
            shellcheck scripts/*.sh
          else
            echo "No shell scripts to check."
          fi

  c-oracle-tests:
    # Builds the DECtalk C source on the runner and runs the full test suite
    # against it. This is the only job where the parity tests (test_capi_parity,
    # test_binary_wav_parity, test_convert_to_phonemes_parity, and the header
    # parity tests under tests/unit/) actually execute — elsewhere they skip
    # cleanly when DECTALK_SRC is absent.
    name: Tests with C library (Ubuntu, Py 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Install C build dependencies
        # Same set as the upstream dectalk/dectalk Dockerfile.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential libasound2-dev libpulse-dev autoconf automake \
            pkg-config

      - name: Build the C oracle (clone + patch + make + assemble)
        run: scripts/setup_c_oracle.sh

      - name: Run full pytest suite with C library
        env:
          DECTALK_SRC: /tmp/dectalk-src
          DECTALK_BIN: /tmp/dectalk-binary-stable
        run: uv run pytest -v 2>&1 | tee /tmp/pytest_full.log

      - name: Capture failure tail for PR comment
        if: failure()
        run: |
          mkdir -p /tmp/ci-failure
          tail -n 200 /tmp/pytest_full.log > /tmp/ci-failure/c-oracle-pytest.txt 2>/dev/null || true

      - name: Upload failure tail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-c-oracle
          path: /tmp/ci-failure/
          if-no-files-found: ignore
          retention-days: 7

  report-ci-status:
    # Posts (or updates) a sticky comment on the PR summarising every job's
    # outcome plus a link to the workflow run. Lets the session read CI
    # status via a single authenticated `pull_request_read get_comments`
    # call instead of probing the workflow-runs API per push.
    name: Report CI status to PR
    needs: [lint-and-type, shellcheck, c-oracle-tests]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const results = {
              'lint-and-type': '${{ needs.lint-and-type.result }}',
              'shellcheck': '${{ needs.shellcheck.result }}',
              'c-oracle-tests': '${{ needs.c-oracle-tests.result }}',
            };
            const icon = (r) => r === 'success' ? ':white_check_mark:'
                              : r === 'skipped' ? ':fast_forward:'
                              : r === 'cancelled' ? ':grey_question:'
                              : ':x:';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const rows = Object.entries(results)
              .map(([name, r]) => `| \`${name}\` | ${icon(r)} ${r} |`)
              .join('\n');
            const overall = Object.values(results).every(r => r === 'success' || r === 'skipped')
              ? ':white_check_mark: **PASS**'
              : ':x: **FAIL**';
            const marker = '<!-- ci-status-comment -->';
            const body = [
              marker,
              `## CI status — ${overall}`,
              ``,
              `Commit \`${sha}\` · [workflow run](${runUrl})`,
              ``,
              `| Job | Result |`,
              `|---|---|`,
              rows,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
