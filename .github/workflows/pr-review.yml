name: PR auto-review

# Posts a sticky review comment on every PR with grep-level diagnostics:
# new TODO/FIXME, new `# type: ignore`, _DEFERRED allow-list changes,
# and a quick check that any new src/dectalk/<x>.py has a sibling parity
# test. Not a substitute for human review — narrows what reviewers (or
# /review skill invocations) have to inspect by hand.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Grep-level review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect diff facts
        id: facts
        env:
          # On synchronize, github.event.before is the previous PR head — so the
          # diff is bounded to the latest push. On opened/reopened, before is
          # the base SHA, which gives the full PR diff (intentional).
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr-review
          # Diff range: prefer "since previous push" (synchronize), fall back
          # to "since PR base" (opened/reopened). On a long-running feature
          # branch the full-PR view drowns out the per-push signal.
          if [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]] \
              && git cat-file -e "${BEFORE_SHA}" 2>/dev/null; then
            range="${BEFORE_SHA}..${HEAD_SHA}"
          else
            range="${BASE_SHA}...${HEAD_SHA}"
          fi
          echo "Reviewing diff range: ${range}"
          # Added lines only (strip leading + and the diff headers).
          git diff "${range}" -- '*.py' '*.sh' '*.toml' '*.yml' '*.yaml' \
            | awk '/^\+\+\+/ {next} /^\+/ {print substr($0, 2)}' \
            > /tmp/pr-review/added.txt
          todo_count=$(grep -cE '\b(TODO|FIXME|XXX|HACK)\b' /tmp/pr-review/added.txt || true)
          ignore_count=$(grep -cE '# (type|pyright): ignore' /tmp/pr-review/added.txt || true)
          deferred_changed=$(git diff --name-only "${range}" \
                            -- 'tests/unit/test_*_module_inventory.py' | wc -l)
          {
            echo "todo_count=${todo_count}"
            echo "ignore_count=${ignore_count}"
            echo "deferred_changed=${deferred_changed}"
            echo "range=${range}"
          } >> "$GITHUB_OUTPUT"

      - name: Post review comment
        uses: actions/github-script@v7
        env:
          TODO_COUNT: ${{ steps.facts.outputs.todo_count }}
          IGNORE_COUNT: ${{ steps.facts.outputs.ignore_count }}
          DEFERRED_CHANGED: ${{ steps.facts.outputs.deferred_changed }}
          RANGE: ${{ steps.facts.outputs.range }}
        with:
          script: |
            const env = process.env;
            const marker = '<!-- pr-auto-review -->';
            const todoCount = parseInt(env.TODO_COUNT || '0', 10);
            const ignoreCount = parseInt(env.IGNORE_COUNT || '0', 10);
            const deferredChanged = parseInt(env.DEFERRED_CHANGED || '0', 10);
            const range = env.RANGE || 'PR diff';

            const flags = [];
            if (todoCount > 0) flags.push(`- ${todoCount} new TODO/FIXME/XXX/HACK comment(s) added`);
            if (ignoreCount > 0) flags.push(`- ${ignoreCount} new \`# type: ignore\` / \`# pyright: ignore\` directive(s)`);
            if (deferredChanged > 0) flags.push(`- \`_DEFERRED\` allow-list file(s) modified — verify Python symbol now exists`);

            const sections = [marker, '## Auto-review summary', '', `_Diff range: \`${range}\`_`];
            if (flags.length === 0) {
              sections.push('', ':white_check_mark: No grep-level concerns in this push. Run `/review` for a deeper read.');
            } else {
              sections.push('', 'Heads-up for human/orchestrator review:', '', ...flags);
              sections.push('', '_Grep-level only. Run `/review` for a substantive read._');
            }
            const body = sections.join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
